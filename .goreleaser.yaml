# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/nuther
    binary: nuther
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    # TODO: Update with your GitHub username/org
    owner: lugnicca
    name: nuther
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

brews:
  - repository:
      # TODO: Update with your GitHub username/org
      owner: lugnicca
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/lugnicca/nuther"
    description: "S.M.A.R.T. disk health monitoring TUI"
    license: "MIT"
    test: |
      system "#{bin}/nuther", "--version"
    install: |
      bin.install "nuther"
